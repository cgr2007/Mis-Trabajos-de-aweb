<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testeo de web con base de datos integrada</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Testeo de web con base de datos integrada</h1>

        <div class="form-group">
            <input type="text" id="ideaTitle" class="input-field" placeholder="Título de la idea...">
            <textarea id="ideaDesc" class="input-field" rows="3" placeholder="Describe tu proyecto..."></textarea>
            <button id="addBtn" class="btn">Guardar en Base de Datos</button>
        </div>

        <div id="ideasGrid" class="ideas-grid">
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <!-- Boton Volver al Inicio -->
    <a href="../index.html" class="home-button">VOLVER AL INICIO</a>
    <style>
        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 9999;
            border-radius: 5px;
            box-shadow: 0 0 10px #00f3ff;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }
    </style>
</body>

</html>
