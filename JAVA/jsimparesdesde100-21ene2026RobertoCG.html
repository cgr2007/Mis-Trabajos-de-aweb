<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impares entre 100 y N (Descendente)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #cabecera {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 25px;
        }

        #principal {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        #lateral {
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #datos {
            flex: 2;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #444;
        }

        #pie {
            width: 100%;
            max-width: 900px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-bottom: 15px;
            font-weight: 600;
        }

        .cb {
            display: none;
        }

        @media (max-width: 768px) {
            #principal {
                flex-direction: column;
            }

            #lateral,
            #datos {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="cabecera"></div>
    <div id="principal">
        <div id="lateral"></div>
        <div id="datos"></div>
        <div class="cb"></div>
    </div>
    <div id="pie"></div>


    <script>
        var cabecera = document.getElementById("cabecera");
        var lateral = document.getElementById("lateral");
        var cajaDatos = document.getElementById("datos");
        var pie = document.getElementById("pie");

        var ahora = new Date();
        var fechalocal = ahora.toLocaleString();

        cabecera.innerHTML = "<h3>Enunciado</h3><h3>jsimpares-21ene2026RobertoCG<br>Impares entre 100 y N</h3>";

        lateral.innerHTML = "<h3>APLICACIONES WEB, " + ahora.getFullYear() + "<br>VM1SMR, Ies Azarquiel<br>Fecha: " + fechalocal + "<br></h3>";

        pie.innerHTML = "<h2>Copyright &copy; Roberto Casado</h2>";


        var num = parseInt(prompt("Introduce un nÃºmero (menor que 100)"));
        var mensaje = "";
        var i = 100;

        while (i >= num) {
            if (i % 2 !== 0) {
                mensaje = mensaje + i + "<br>";
            }
            i--;
        }

        cajaDatos.innerHTML = mensaje;
    </script>
<!-- Boton Volver al Inicio -->
<a href="../Proyectos/index.html" class="home-button">VOLVER AL INICIO</a>
<style>
    .home-button {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #00f3ff;
        border: 2px solid #00f3ff;
        text-decoration: none;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        text-transform: uppercase;
        z-index: 9999;
        border-radius: 5px;
        box-shadow: 0 0 10px #00f3ff;
        transition: all 0.3s ease;
    }
    .home-button:hover {
        background: #00f3ff;
        color: #000;
        box-shadow: 0 0 20px #00f3ff;
    }
</style>
</body>

</html>
