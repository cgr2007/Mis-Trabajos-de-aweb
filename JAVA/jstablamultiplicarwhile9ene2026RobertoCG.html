<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Multiplicar (While)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #cabecera {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 25px;
        }

        #principal {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        #lateral {
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #datos {
            flex: 2;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #444;
        }

        #pie {
            width: 100%;
            max-width: 900px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-bottom: 15px;
            font-weight: 600;
        }

        .cb {
            display: none;
        }

        @media (max-width: 768px) {
            #principal {
                flex-direction: column;
            }

            #lateral,
            #datos {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="cabecera"></div>
    <div id="principal">
        <div id="lateral"></div>
        <div id="datos"></div>
        <div class="cb"></div>
    </div>
    <div id="pie"></div>


    <script>
        const cabecera = document.getElementById("cabecera");
        const lateral = document.getElementById("lateral");
        const cajaDatos = document.getElementById("datos");
        const pie = document.getElementById("pie");

        const ahora = new Date();
        const fechalocal = ahora.toLocaleString();

        cabecera.innerHTML = `
            <h3>Enunciado</h3>
            <h3>
                jstablamultiplicarwhile9ene2026RobertoCG<br>
                Tabla de Multiplicar
            </h3>
        `;

        lateral.innerHTML = `
            <h3>
                APLICACIONES WEB, ${ahora.getFullYear()}<br>
                VM1SMR, Ies Azarquiel<br>
                Fecha: ${fechalocal}<br>
            </h3>
        `;

        pie.innerHTML = `<h2>Copyright &copy; Roberto Casado</h2>`;


        let numero = parseInt(prompt("Introduce un número"));
        let mensaje = ""; //numero escrito que no cambiara a la hora de mostrar la tabla de multiplicar hasta el diez. 
        let contador = 1; //contador que ira aumentando hasta el diez. 

        while (contador <= 10) {
            mensaje += `${numero} x ${contador} = ${numero * contador}<br>`;
            contador++;
        } //resultado de la multiplicacion del mensaje por el contador en bucle hasta el numero diez. 

        cajaDatos.innerHTML = mensaje;
    </script>
</body>



</html>
