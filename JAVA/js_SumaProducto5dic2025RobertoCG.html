<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma y Producto</title>
</head>
<body>
    <script>
        let num1 = parseInt(prompt("Introduce el primer numero"));
        let num2 = parseInt(prompt("Introduce el segundo numero"));
        document.write("La suma de " + num1 + " y " + num2 + " es " + (num1 + num2));
        document.write("<br>");
        document.write("La multiplicacion de " + num1 + " y " + num2 + " es " + (num1 * num2));
    </script>
<!-- Boton Volver al Inicio -->
<a href="../Proyectos/index.html" class="home-button">VOLVER AL INICIO</a>
<style>
    .home-button {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #00f3ff;
        border: 2px solid #00f3ff;
        text-decoration: none;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        text-transform: uppercase;
        z-index: 9999;
        border-radius: 5px;
        box-shadow: 0 0 10px #00f3ff;
        transition: all 0.3s ease;
    }
    .home-button:hover {
        background: #00f3ff;
        color: #000;
        box-shadow: 0 0 20px #00f3ff;
    }
</style>
</body>
</html>
