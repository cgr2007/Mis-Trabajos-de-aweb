<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichero contenedores</title>
    <style type="text/css">
        html,
        body {
            height: 100%;
        }

        #contenido {
            margin: 10px;
            overflow: hidden;
            height: 100%;
        }

        #secundario {
            border: 1px solid #555555;
            padding: 5px;
            width: 200px;
            background-color: #ffff55;
            float: left;
            height: 100%;
        }

        #principal {
            padding: 10px;
            margin-left: 220px;
            background-color: #ffffbb;
            height: 100%;
        }

        body {
            background-color: #333333;
            font-family: verdana;
            font-size: 15px;
            color: #666666;
        }
    </style>
</head>

<body>
    <div id="contenido">
        <div id="secundario">
            Columna de la izquierda. Columna de la izquierda.
            Columna de la izquierda. Columna de la izquierda.
        </div>
        <div id="principal">
            Contenido principal. Contenido principal.
            Contenido principal. Contenido principal.
        </div>
    </div>
    <!-- Boton Volver al Inicio -->
    <a href="../index.html" class="home-button">VOLVER AL INICIO</a>
    <style>
        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 9999;
            border-radius: 5px;
            box-shadow: 0 0 10px #00f3ff;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }
    </style>
</body>

</html>
