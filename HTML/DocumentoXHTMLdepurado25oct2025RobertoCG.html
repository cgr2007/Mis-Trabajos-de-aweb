<?xml version="1.0" encoding='UTF-8'?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">

<head>
    <title>Formateando texto</title>
</head>

<body>
    <h1 align="center">Cabecera centrada</h1>
    <p>Lista de elementos</p>
    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
    </ul>
    <hr />
    <br />
    <p>Tabla de oficios</p>
    <table border="1">
        <tr>
            <th>OFICIO</th>
            <th>SALARIO</th>
        </tr>

        <tr>
            <th>EMPLEADO</th>
            <td>1200Euros</td>
        </tr>
        <tr>
            <th>BOMBERO</th>
            <td>1500Euros</td>
        </tr>
        <tr>
            <th>MAQUINISTA</th>
            <td>1600Euros</td>
        </tr>
    </table>
    <form action="#" method="get">
        <select name="semana">
            <option value="lunes">Lunes</option>
            <option value="martes">Martes</option>
            <option value="domingo" selected="selected">Domingo</option>
        </select>
    </form>
    <!-- Boton Volver al Inicio -->
    <a href="../index.html" class="home-button">VOLVER AL INICIO</a>
    <style>
        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 9999;
            border-radius: 5px;
            box-shadow: 0 0 10px #00f3ff;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }
    </style>
</body>

</html>
