<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probando checkbox</title>
</head>

<body bgcolor="#2874A6">
    <div align="Center">
        <h1>Roberto Casado</h1>
        <hr>
        <br>
        <H2>Probando Checkbox</H2>
    </div>
    <hr>
    <br>
    <br>
    <div align="Center">
        <form action="#" method="get">
            <table height="50" width="170">
                <h2>
                    <font color="black">Seleciona aficiones</font>
                </h2>
                <tr>
                    <td>
                        <input type="checkbox" name="tenis" value="Tenis" />Practicar Tenis
                    </td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="tenis" value="Futbol" />Practicar Futbol</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="tenis" value="Padel" />Practicar Padel</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="tenis" value="Videojuegos" />Practicar Videojuegos</td>
                </tr>
            </table>
            <h3>Desplegable con Asignaturas</h3>
            <h4>Seleciona uno</h4>
            <select name="Mi lista">
                <option value="uno">REDL</option>
                <option value="dos" selected>AWEB</option>
                <option value="tres">SOM</option>
                <option value="cuatro">MMEQ</option>
                <option value="cinco">IPE</option>
                <option value="seis">Proyecto</option>
                <option value="siete">Sostenibilidad</option>
                <option value="ocho">Ingles</option>
            </select>
            <br>
            <br>
            <td><input type="submit" value="Enviar" name="Enviar" /></td>
            <td><input type="reset" value="Borrar" name="Borrar" /></td>
            <td><input type="button" value="Ir a Google" onclick="window.open('https://www.google.com')" />
            </td>
        </form>
<!-- Boton Volver al Inicio -->
<a href="../Proyectos/index.html" class="home-button">VOLVER AL INICIO</a>
<style>
    .home-button {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #00f3ff;
        border: 2px solid #00f3ff;
        text-decoration: none;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        text-transform: uppercase;
        z-index: 9999;
        border-radius: 5px;
        box-shadow: 0 0 10px #00f3ff;
        transition: all 0.3s ease;
    }
    .home-button:hover {
        background: #00f3ff;
        color: #000;
        box-shadow: 0 0 20px #00f3ff;
    }
</style>

</html>
