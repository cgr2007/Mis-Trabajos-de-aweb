<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probando checkbox</title>
</head>

<body bgcolor="#2874A6">
    <div align="Center">
        <h1>Roberto Casado</h1>
        <hr>
        <br>
        <H2>Probando Checkbox</H2>
    </div>
    <hr>
    <br>
    <br>
    <div align="Center">
        <form action="#" method="get">
            <table height="50" width="170">
                <h2>
                    <font color="black">Seleciona aficiones</font>
                </h2>
                <tr>
                    <td>
                        <input type="checkbox" name="tenis" value="Tenis" />Practicar Tenis
                    </td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="Futbol" value="Futbol" />Practicar Futbol</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="Padel" value="Padel" />Practicar Padel</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="Videojuegos" value="Videojuegos" />Practicar Videojuegos</td>
                </tr>
                <tr>
                    <td><input type="submit" /></td>
                </tr>
            </table>
        </form>
        <!-- Boton Volver al Inicio -->
        <a href="../index.html" class="home-button">VOLVER AL INICIO</a>
        <style>
            .home-button {
                position: fixed;
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #00f3ff;
                border: 2px solid #00f3ff;
                text-decoration: none;
                font-family: 'Courier New', Courier, monospace;
                font-weight: bold;
                text-transform: uppercase;
                z-index: 9999;
                border-radius: 5px;
                box-shadow: 0 0 10px #00f3ff;
                transition: all 0.3s ease;
            }

            .home-button:hover {
                background: #00f3ff;
                color: #000;
                box-shadow: 0 0 20px #00f3ff;
            }
        </style>
</body>

</html>
